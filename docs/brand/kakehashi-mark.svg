<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Kakehashi">
  <title>Kakehashi</title>
  <desc>A bridge in three brush strokes: the span, the arch beneath it, and the water it crosses.</desc>

  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22242A" />
      <stop offset="1" stop-color="#131519" />
    </linearGradient>
    <linearGradient id="span" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#E9E7E3" />
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#plate)" />
  <rect x="1.5" y="1.5" width="253" height="253" rx="56.5" fill="none" stroke="#33363D" stroke-width="3" />

  <!-- The span. The longest stroke, and the one the name is about. -->
  <rect x="40" y="78" width="176" height="16" rx="8" fill="url(#span)" />

  <!-- The arch. Tapered to nothing at both ends, the way a brush leaves the paper. -->
  <path d="M48 148 Q128 58 208 148 Q128 90 48 148 Z" fill="#E0503A" />

  <!-- The water it crosses. -->
  <rect x="88" y="164" width="80" height="14" rx="7" fill="#8A8D95" />
</svg>
