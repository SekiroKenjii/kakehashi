    <circle cx="922" cy="92" r="5" fill="#4EC77B" />
    <text x="941" y="98" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-weight="600" font-size="15" letter-spacing="4.5" fill="#E4E6EA">SEKIROKENJII</text>
  </g>
