      <text x="494" y="589" font-size="13" font-weight="600" letter-spacing="0.8" fill="#C8CACE">KAKEHASHI</text>
      <path d="M492 615 L500 615 L496 621 Z" fill="#8F939B" />
      <text x="510" y="623" fill="#AEB2B9">proto</text>
      <path d="M508 647 L516 647 L512 653 Z" fill="#8F939B" />
      <text x="526" y="655" fill="#AEB2B9">kakehashi/activity/v1</text>
      <rect x="460" y="664" width="262" height="32" rx="6" fill="#1D2026" />
      <rect x="542" y="672" width="12" height="14" rx="2" fill="none" stroke="#E0503A" stroke-width="1.6" />
      <text x="564" y="686" fill="#E8E9EB">activity.proto</text>
      <rect x="542" y="704" width="12" height="14" rx="2" fill="none" stroke="#5A5F68" stroke-width="1.6" />
      <text x="564" y="718" fill="#8F939B">navigation.proto</text>
      <path d="M494 742 L500 746 L494 750 Z" fill="#8F939B" />
      <text x="510" y="751" fill="#8F939B">server/internal/modules</text>
      <path d="M494 774 L500 778 L494 782 Z" fill="#8F939B" />
      <text x="510" y="783" fill="#8F939B">client/src/Modules</text>
      <path d="M494 806 L500 810 L494 814 Z" fill="#8F939B" />
