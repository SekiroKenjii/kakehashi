    <g font-family="Consolas,'Cascadia Code','Cascadia Mono',Menlo,monospace">
      <rect x="1612" y="726" width="98" height="30" rx="7" fill="#1D2026" />
      <text x="1626" y="747" font-size="15" fill="#D3D5D9">archlint</text>
      <text x="1612" y="786" font-size="13" xml:space="preserve"><tspan fill="#7BC97C">&#10003;</tspan><tspan fill="#767B84"> 60 packages, no violations</tspan></text>

      <rect x="1612" y="822" width="188" height="30" rx="7" fill="#1D2026" />
