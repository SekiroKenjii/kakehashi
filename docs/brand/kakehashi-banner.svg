    <circle cx="460" cy="470" r="6.5" fill="#3A3E46" />
    <circle cx="484" cy="470" r="6.5" fill="#3A3E46" />
    <rect x="810" y="456" width="380" height="30" rx="15" fill="#0F1114" stroke="#22242B" />
    <text x="1000" y="476" text-anchor="middle" font-family="Consolas,'Cascadia Code','Cascadia Mono',Menlo,monospace" font-size="15" fill="#8A8D95">SekiroKenjii/kakehashi</text>
    <rect x="401" y="499" width="1198" height="1" fill="#1F2127" />

    <!-- activity bar -->
    <rect x="401" y="500" width="55" height="580" fill="#0C0E12" />
    <rect x="401" y="510" width="3" height="34" fill="#E6E7E9" />
    <g stroke="#B9BCC2" stroke-width="2" fill="none">
      <rect x="420" y="518" width="14" height="18" rx="2" />
      <rect x="426" y="513" width="14" height="18" rx="2" />
