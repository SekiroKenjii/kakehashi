    <!-- explorer -->
    <rect x="456" y="500" width="270" height="580" fill="#101216" />
    <text x="476" y="548" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="13" letter-spacing="1.8" fill="#8B909A">EXPLORER</text>
    <g font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="15">
