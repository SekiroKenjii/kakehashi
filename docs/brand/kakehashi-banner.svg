      <circle cx="1590" cy="734" r="4" /><circle cx="1590" cy="752" r="4" /><path d="M1590 738 L1590 748" />
      <circle cx="1590" cy="830" r="4" /><circle cx="1590" cy="848" r="4" /><path d="M1590 834 L1590 844" />
      <circle cx="1590" cy="926" r="4" /><circle cx="1590" cy="944" r="4" /><path d="M1590 930 L1590 940" />
