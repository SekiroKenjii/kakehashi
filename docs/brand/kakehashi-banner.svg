<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1080" width="2000" height="1080" role="img" aria-label="Kakehashi — 架け橋. A WinUI 3 client, a Go backend, one contract the build enforces.">
  <title>Kakehashi</title>
  <desc>架け橋 — the bridge you build across. A WinUI 3 client, a Go backend, and one contract checked against both halves.</desc>

  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08090C" />
      <stop offset="1" stop-color="#060709" />
    </linearGradient>
    <radialGradient id="shu" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E0503A" stop-opacity="0.24" />
      <stop offset="0.5" stop-color="#A83A2C" stop-opacity="0.09" />
      <stop offset="1" stop-color="#E0503A" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="spill" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#B23A2C" stop-opacity="0.10" />
      <stop offset="1" stop-color="#B23A2C" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="span" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#E9E7E3" />
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5A54A" />
      <stop offset="1" stop-color="#E0503A" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17191F" />
      <stop offset="1" stop-color="#111318" />
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22242A" />
      <stop offset="1" stop-color="#131519" />
    </linearGradient>
    <pattern id="dotgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#23252C" />
    </pattern>
  </defs>

