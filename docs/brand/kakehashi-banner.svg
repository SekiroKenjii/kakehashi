    <circle cx="446" cy="536" r="8.5" fill="#E0503A" />
    <text x="446" y="540.5" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="11" fill="#FFFFFF">1</text>
    <g stroke="#6E7480" stroke-width="2" fill="none">
      <circle cx="427" cy="578" r="8" />
      <path d="M433 584 L441 592" />
      <circle cx="422" cy="634" r="3.6" />
