      <rect x="494" y="868" width="12" height="14" rx="2" fill="none" stroke="#5A5F68" stroke-width="1.6" />
      <text x="516" y="882" fill="#8F939B">CONTRIBUTING.md</text>
    </g>

    <!-- tabs -->
    <rect x="726" y="500" width="874" height="46" fill="#101216" />
    <rect x="726" y="500" width="220" height="46" fill="#16181E" />
    <circle cx="750" cy="523" r="5" fill="#E0503A" />
    <text x="766" y="529" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="15" fill="#E6E7E9">activity.proto</text>
    <text x="968" y="529" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="15" fill="#7C818A"><tspan fill="#4EC9B0">{}</tspan>&#160;&#160;module.go</text>

    <!-- editor -->
    <rect x="726" y="546" width="874" height="534" fill="#16181E" />
    <g font-family="Consolas,'Cascadia Code','Cascadia Mono',Menlo,monospace" font-size="18">
      <g fill="#4A4E57" text-anchor="end">
        <text x="768" y="584">30</text><text x="768" y="617">31</text><text x="768" y="650">32</text><text x="768" y="683">33</text><text x="768" y="716">34</text><text x="768" y="749">35</text><text x="768" y="782">36</text><text x="768" y="815">37</text><text x="768" y="848">38</text><text x="768" y="881">39</text><text x="768" y="914">40</text><text x="768" y="947">41</text><text x="768" y="980">42</text><text x="768" y="1013">43</text><text x="768" y="1046">44</text><text x="768" y="1079">45</text>
      </g>
      <text x="792" y="584" xml:space="preserve" fill="#6A9955">// ActivityService is the activity module's entire remote surface.</text>
      <text x="792" y="617" xml:space="preserve"><tspan fill="#569CD6">service </tspan><tspan fill="#4EC9B0">ActivityService </tspan><tspan fill="#C9CBD1">{</tspan></text>
      <text x="792" y="650" xml:space="preserve" fill="#6A9955">  // ListActivity returns the caller's own entries, newest first.</text>
      <text x="792" y="683" xml:space="preserve"><tspan fill="#C9CBD1">  </tspan><tspan fill="#569CD6">rpc </tspan><tspan fill="#DCDCAA">ListActivity</tspan><tspan fill="#C9CBD1">(</tspan><tspan fill="#4EC9B0">ListActivityRequest</tspan><tspan fill="#C9CBD1">) </tspan><tspan fill="#569CD6">returns</tspan><tspan fill="#C9CBD1"> (</tspan><tspan fill="#4EC9B0">ListActivityResponse</tspan><tspan fill="#C9CBD1">);</tspan></text>
      <text x="792" y="716" xml:space="preserve" fill="#C9CBD1"> </text>
      <text x="792" y="749" xml:space="preserve" fill="#6A9955">  // Report one thing the client knows about itself and</text>
      <text x="792" y="782" xml:space="preserve" fill="#6A9955">  // the server cannot observe.</text>
      <text x="792" y="815" xml:space="preserve"><tspan fill="#C9CBD1">  </tspan><tspan fill="#569CD6">rpc </tspan><tspan fill="#DCDCAA">RecordClientEvent</tspan><tspan fill="#C9CBD1">(</tspan><tspan fill="#4EC9B0">RecordClientEventRequest</tspan><tspan fill="#C9CBD1">)</tspan></text>
      <text x="792" y="848" xml:space="preserve"><tspan fill="#C9CBD1">      </tspan><tspan fill="#569CD6">returns</tspan><tspan fill="#C9CBD1"> (</tspan><tspan fill="#4EC9B0">RecordClientEventResponse</tspan><tspan fill="#C9CBD1">);</tspan></text>
      <text x="792" y="881" xml:space="preserve" fill="#C9CBD1">}</text>
      <text x="792" y="914" xml:space="preserve" fill="#C9CBD1"> </text>
      <text x="792" y="947" xml:space="preserve" fill="#6A9955">// Entry is one thing that happened.</text>
      <text x="792" y="980" xml:space="preserve"><tspan fill="#569CD6">message </tspan><tspan fill="#4EC9B0">Entry </tspan><tspan fill="#C9CBD1">{</tspan></text>
      <text x="792" y="1013" xml:space="preserve"><tspan fill="#C9CBD1">  </tspan><tspan fill="#569CD6">string </tspan><tspan fill="#9CDCFE">kind </tspan><tspan fill="#C9CBD1">= </tspan><tspan fill="#B5CEA8">1</tspan><tspan fill="#C9CBD1">;</tspan></text>
      <text x="792" y="1046" xml:space="preserve"><tspan fill="#C9CBD1">  </tspan><tspan fill="#569CD6">string </tspan><tspan fill="#9CDCFE">device </tspan><tspan fill="#C9CBD1">= </tspan><tspan fill="#B5CEA8">2</tspan><tspan fill="#C9CBD1">;</tspan></text>
      <text x="792" y="1079" xml:space="preserve"><tspan fill="#C9CBD1">  </tspan><tspan fill="#569CD6">string </tspan><tspan fill="#9CDCFE">ip_address </tspan><tspan fill="#C9CBD1">= </tspan><tspan fill="#B5CEA8">3</tspan><tspan fill="#C9CBD1">;</tspan></text>
    </g>
  </g>

