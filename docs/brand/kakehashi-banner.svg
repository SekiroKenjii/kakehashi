<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1080" width="2000" height="1080" role="img" aria-label="Kakehashi — 架け橋. Boilerplate + CLI: a WinUI 3 client, a Go server, one contract, three gates.">
  <title>Kakehashi</title>
  <desc>架け橋 — the bridge you build across. Boilerplate + CLI: scaffold a WinUI 3 client and a Go server, generate modules across both halves, and keep three architecture gates green.</desc>

  <defs>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E7D1B9" stop-opacity="0.85" />
      <stop offset="1" stop-color="#E7D1B9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="shu" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C4513C" stop-opacity="0.10" />
      <stop offset="1" stop-color="#C4513C" stop-opacity="0" />
    </radialGradient>
    <pattern id="dotgrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#E4D3B9" />
    </pattern>
    <clipPath id="tileclip"><rect x="13" y="11" width="466" height="468" rx="88"/></clipPath>
    <path id="shimaki" d="M 104 148 L 400 148 Q 405 148 404 156 L 397 181 Q 395 187 389 187 L 115 187 Q 109 187 107 181 L 100 156 Q 99 148 104 148 Z"/>
    <clipPath id="shimakiclip"><use href="#shimaki"/></clipPath>
    <g id="tile">
      <rect x="0" y="0" width="492" height="490" rx="102" fill="#0B0B0F"/>
      <g clip-path="url(#tileclip)">
        <rect x="0" y="0" width="492" height="490" fill="#F4EADB"/>
        <g fill="#ECDECA">
          <g><circle cx="97" cy="106" r="19"/><circle cx="124" cy="92" r="25"/><circle cx="152" cy="105" r="18"/><rect x="75" y="99" width="100" height="23" rx="11"/></g>
          <g><circle cx="338" cy="107" r="17"/><circle cx="370" cy="93" r="25"/><circle cx="404" cy="101" r="22"/><rect x="319" y="99" width="106" height="23" rx="11"/></g>
          <g><circle cx="57" cy="245" r="10"/><circle cx="71" cy="239" r="13"/><circle cx="86" cy="245" r="9"/><rect x="45" y="242" width="51" height="13" rx="6.5"/></g>
          <g><circle cx="415" cy="245" r="10"/><circle cx="430" cy="238" r="13"/><circle cx="445" cy="245" r="9"/><rect x="404" y="242" width="51" height="13" rx="6.5"/></g>
        </g>
        <path d="M 60 408 A 186 152 0 0 1 432 408 Z" fill="#E7D1B9"/>
        <ellipse cx="250" cy="424" rx="150" ry="14" fill="#E4D4BF"/>
        <path d="M 61 406 A 185 84 0 0 1 431 406 Z" fill="#17181B"/>
        <g>
          <polygon points="140,186 167,186 167,389 133,389" fill="#C4513C"/>
          <polygon points="336,186 365,186 371,389 336,389" fill="#C4513C"/>
          <rect x="238" y="185" width="26" height="36" fill="#BD4D38"/>
          <rect x="140" y="187" width="27" height="7" fill="#A34131"/>
          <rect x="336" y="187" width="29" height="7" fill="#A34131"/>
          <rect x="238" y="185" width="26" height="14" fill="#A54334"/>
          <rect x="116" y="215" width="272" height="28" rx="7" fill="#C7533E"/>
          <rect x="135" y="243" width="32" height="6" fill="#8F3A2B" opacity="0.35"/>
          <rect x="336" y="243" width="33" height="6" fill="#8F3A2B" opacity="0.35"/>
          <polygon points="163,193 167,193 167,389 163,389" fill="#8F3A2B" opacity="0.22"/>
          <polygon points="361,193 365,193 371,389 367,389" fill="#8F3A2B" opacity="0.25"/>
          <use href="#shimaki" fill="#C4513C"/>
          <g clip-path="url(#shimakiclip)">
            <path d="M 92 156 C 166 168, 326 168, 410 156 L 410 164 C 326 176, 166 176, 92 164 Z" fill="#A34131"/>
          </g>
          <path d="M 84 131 C 168 147, 324 147, 418 131 L 410 156 C 326 168, 166 168, 92 156 Z" fill="#1C1E20"/>
        </g>
      </g>
    </g>
  </defs>

  <!-- paper -->
  <rect width="2000" height="1080" fill="#F4EADB" />
  <rect width="2000" height="1080" fill="url(#dotgrid)" opacity="0.5" />
  <ellipse cx="640" cy="300" rx="860" ry="420" fill="url(#sun)" />
  <ellipse cx="1440" cy="620" rx="1120" ry="480" fill="url(#shu)" />

  <!-- clouds -->
  <g fill="#ECDECA">
    <g><circle cx="150" cy="130" r="24"/><circle cx="186" cy="112" r="32"/><circle cx="224" cy="128" r="23"/><rect x="122" y="121" width="130" height="29" rx="14"/></g>
    <g><circle cx="1706" cy="96" r="20"/><circle cx="1742" cy="80" r="28"/><circle cx="1778" cy="90" r="24"/><rect x="1684" y="88" width="120" height="26" rx="13"/></g>
    <g><circle cx="322" cy="712" r="12"/><circle cx="339" cy="704" r="15"/><circle cx="356" cy="712" r="11"/><rect x="308" y="708" width="62" height="15" rx="7.5"/></g>
    <g><circle cx="586" cy="936" r="12"/><circle cx="603" cy="928" r="15"/><circle cx="620" cy="936" r="11"/><rect x="572" y="932" width="62" height="15" rx="7.5"/></g>
  </g>

  <!-- ── left: the lockup and the claim ─────────────────────────────────────────────────── -->
  <use href="#tile" transform="translate(128,148) scale(0.3577)" />
  <text x="336" y="230" font-weight="700" font-size="64" fill="#1F2125"><tspan font-family="'Yu Gothic UI','Noto Sans JP','Hiragino Sans','Meiryo',sans-serif" letter-spacing="2">架け橋</tspan><tspan font-family="'Segoe UI Variable Display','Segoe UI',system-ui,Arial,sans-serif" letter-spacing="-2">&#160;Kakehashi</tspan></text>
  <text x="338" y="284" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="30" fill="#8B7B66">The bridge you build across</text>

  <text x="128" y="432" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="35" fill="#5C5142"><tspan font-weight="700" fill="#1F2125">Boilerplate + CLI.</tspan> A WinUI 3 client, a Go server,</text>
  <text x="128" y="484" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="35" fill="#5C5142">one contract &#8212; scaffolded in a minute,</text>
  <text x="128" y="536" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="35" fill="#5C5142">grown a module at a time.</text>

  <g font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-weight="600" font-size="27">
    <rect x="128" y="600" width="152" height="54" rx="12" fill="#1F2125" />
    <text x="204" y="636" text-anchor="middle" fill="#F4EADB">2 halves</text>
    <rect x="300" y="600" width="180" height="54" rx="12" fill="#1F2125" />
    <text x="390" y="636" text-anchor="middle" fill="#F4EADB">1 contract</text>
    <rect x="500" y="600" width="152" height="54" rx="12" fill="#C4513C" />
    <text x="576" y="636" text-anchor="middle" fill="#F4EADB">3 gates</text>
  </g>

  <!-- ── right: the terminal, which is the product ──────────────────────────────────────── -->
  <g>
    <rect x="1016" y="164" width="864" height="330" rx="22" fill="#3A2F21" opacity="0.14" />
    <rect x="1024" y="152" width="848" height="330" rx="20" fill="#17181B" stroke="#0B0B0F" />
    <path d="M 1024 192 L 1872 192" stroke="#0B0B0F" stroke-width="1" />
    <rect x="1024" y="152" width="848" height="40" rx="20" fill="#1C1E20" />
    <rect x="1024" y="172" width="848" height="20" fill="#1C1E20" />
    <circle cx="1054" cy="172" r="7" fill="#3A3D42" />
    <circle cx="1078" cy="172" r="7" fill="#3A3D42" />
    <circle cx="1102" cy="172" r="7" fill="#3A3D42" />
    <g font-family="Consolas,'Cascadia Code','Cascadia Mono',Menlo,monospace" font-size="25">
      <text x="1064" y="248" fill="#D8CDBC"><tspan fill="#8B7B66">$</tspan> kakehashi new OrderDesk</text>
      <text x="1064" y="302" fill="#7FB069">&#10003; <tspan fill="#D8CDBC">fetch&#160;&#160;</tspan>&#10003; <tspan fill="#D8CDBC">verify&#160;&#160;</tspan>&#10003; <tspan fill="#D8CDBC">apply&#160;&#160;</tspan>&#10003; <tspan fill="#D8CDBC">check&#160;&#160;</tspan>&#10003; <tspan fill="#D8CDBC">git</tspan></text>
      <text x="1064" y="374" fill="#D8CDBC"><tspan fill="#8B7B66">$</tspan> kakehashi add module orders</text>
      <text x="1064" y="428" fill="#D8CDBC">archlint <tspan fill="#7FB069">&#10003;</tspan>&#160;&#160;ArchitectureTests <tspan fill="#7FB069">&#10003;</tspan>&#160;&#160;buf breaking <tspan fill="#7FB069">&#10003;</tspan></text>
    </g>
  </g>

  <!-- ── the three gates, one card each ─────────────────────────────────────────────────── -->
  <g>
    <rect x="1024" y="660" width="266" height="230" rx="16" fill="#FBF5EA" stroke="#E0D3BC" />
    <rect x="1040" y="660" width="234" height="6" rx="3" fill="#C4513C" />
    <g transform="translate(1052,694) scale(2)" fill="none">
      <rect x="2" y="4" width="14" height="22" rx="3" stroke="#C4513C" stroke-width="2.5" />
      <rect x="28" y="4" width="14" height="22" rx="3" stroke="#C4513C" stroke-width="2.5" />
      <path d="M22 1v28" stroke="#1C1E20" stroke-width="2.5" stroke-linecap="round" />
    </g>
    <text x="1052" y="806" font-family="Consolas,'Cascadia Code','Cascadia Mono',Menlo,monospace" font-weight="700" font-size="26" fill="#1F2125">archlint</text>
    <text x="1052" y="840" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="20" fill="#8B7B66">Module boundaries</text>
    <text x="1052" y="866" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="20" fill="#8B7B66">in the Go server</text>

    <rect x="1314" y="660" width="266" height="230" rx="16" fill="#FBF5EA" stroke="#E0D3BC" />
    <rect x="1330" y="660" width="234" height="6" rx="3" fill="#C4513C" />
    <g transform="translate(1342,694) scale(2)" fill="none">
      <rect x="8" y="2" width="28" height="6" rx="2" stroke="#C4513C" stroke-width="2.5" />
      <rect x="8" y="12" width="28" height="6" rx="2" stroke="#C4513C" stroke-width="2.5" />
      <rect x="8" y="22" width="28" height="6" rx="2" stroke="#1C1E20" stroke-width="2.5" />
    </g>
    <text x="1342" y="806" font-family="Consolas,'Cascadia Code','Cascadia Mono',Menlo,monospace" font-weight="700" font-size="24" fill="#1F2125">ArchitectureTests</text>
    <text x="1342" y="840" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="20" fill="#8B7B66">The three layers</text>
    <text x="1342" y="866" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="20" fill="#8B7B66">in the WinUI client</text>

    <rect x="1604" y="660" width="266" height="230" rx="16" fill="#FBF5EA" stroke="#E0D3BC" />
    <rect x="1620" y="660" width="234" height="6" rx="3" fill="#C4513C" />
    <g transform="translate(1632,694) scale(2)" fill="none">
      <path d="M12 3 5 15l7 12" stroke="#C4513C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M32 3l7 12-7 12" stroke="#C4513C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="22" cy="15" r="3" fill="#1C1E20" />
    </g>
    <text x="1632" y="806" font-family="Consolas,'Cascadia Code','Cascadia Mono',Menlo,monospace" font-weight="700" font-size="26" fill="#1F2125">buf breaking</text>
    <text x="1632" y="840" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="20" fill="#8B7B66">The contract</text>
    <text x="1632" y="866" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="20" fill="#8B7B66">between the halves</text>
  </g>

  <!-- ground -->
  <rect x="0" y="1028" width="2000" height="52" fill="#17181B" />
</svg>
