  <text x="575" y="259" font-weight="700" font-size="128" fill="#F7F6F4"><tspan font-family="'Yu Gothic UI','Noto Sans JP','Hiragino Sans','Meiryo',sans-serif" letter-spacing="4">架け橋</tspan><tspan font-family="'Segoe UI Variable Display','Segoe UI',system-ui,Arial,sans-serif" letter-spacing="-3">&#160;Kakehashi</tspan></text>
  <text x="1000" y="342" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="27" fill="#9BA0AA">The High-Performance bridge you build across</text>

