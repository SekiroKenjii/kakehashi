      <text x="1612" y="882" font-size="13" xml:space="preserve"><tspan fill="#7BC97C">&#10003;</tspan><tspan fill="#767B84"> three layers, no leaks</tspan></text>

      <rect x="1612" y="918" width="132" height="30" rx="7" fill="#1D2026" />
      <text x="1626" y="939" font-size="15" fill="#D3D5D9">buf breaking</text>
      <text x="1612" y="978" font-size="13" xml:space="preserve"><tspan fill="#7BC97C">&#10003;</tspan><tspan fill="#767B84"> the wire stays compatible</tspan></text>
