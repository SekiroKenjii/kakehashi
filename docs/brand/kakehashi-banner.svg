    <text x="116" y="818" font-size="13" letter-spacing="1.8" fill="#8B909A">SERVER CONSOLE</text>
    <g font-family="Consolas,'Cascadia Code','Cascadia Mono',Menlo,monospace" font-size="15">
      <text x="116" y="854" xml:space="preserve"><tspan fill="#8A8D95">$ </tspan><tspan fill="#C9CBD1">docker compose up -d</tspan></text>
      <text x="116" y="884" xml:space="preserve"><tspan fill="#7BC97C">&#10003;</tspan><tspan fill="#8A8D95"> mssql healthy   </tspan><tspan fill="#7BC97C">&#10003;</tspan><tspan fill="#8A8D95"> mongo healthy</tspan></text>
      <text x="116" y="914" xml:space="preserve" fill="#7BC97C">booted · 6 modules · :8080</text>
      <text x="116" y="944" xml:space="preserve" fill="#6E7480">grpc · grpc-web · json, one port</text>
      <text x="116" y="974" xml:space="preserve" fill="#6E7480">oidc issuer ready · in-app sign-in</text>
      <text x="116" y="1004" xml:space="preserve" fill="#6E7480">activity retention · 90 days</text>
      <rect x="116" y="1022" width="9" height="18" fill="#E0503A" />
    </g>
  </g>

