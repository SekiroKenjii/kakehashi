          <g><circle cx="415" cy="245" r="10"/><circle cx="430" cy="238" r="13"/><circle cx="445" cy="245" r="9"/><rect x="404" y="242" width="51" height="13" rx="6.5"/></g>
        </g>
        <path d="M 60 408 A 186 152 0 0 1 432 408 Z" fill="#E7D1B9"/>
        <ellipse cx="250" cy="424" rx="150" ry="14" fill="#E4D4BF"/>
        <path d="M 61 406 A 185 84 0 0 1 431 406 Z" fill="#17181B"/>
        <g>
          <polygon points="140,186 167,186 167,389 133,389" fill="#C4513C"/>
          <polygon points="336,186 365,186 371,389 336,389" fill="#C4513C"/>
          <rect x="238" y="185" width="26" height="36" fill="#BD4D38"/>
          <rect x="140" y="187" width="27" height="7" fill="#A34131"/>
          <rect x="336" y="187" width="29" height="7" fill="#A34131"/>
          <rect x="238" y="185" width="26" height="14" fill="#A54334"/>
          <rect x="116" y="215" width="272" height="28" rx="7" fill="#C7533E"/>
          <rect x="135" y="243" width="32" height="6" fill="#8F3A2B" opacity="0.35"/>
          <rect x="336" y="243" width="33" height="6" fill="#8F3A2B" opacity="0.35"/>
          <polygon points="163,193 167,193 167,389 163,389" fill="#8F3A2B" opacity="0.22"/>
          <polygon points="361,193 365,193 371,389 367,389" fill="#8F3A2B" opacity="0.25"/>
          <use href="#shimaki" fill="#C4513C"/>
          <g clip-path="url(#shimakiclip)">
            <path d="M 92 156 C 166 168, 326 168, 410 156 L 410 164 C 326 176, 166 176, 92 164 Z" fill="#A34131"/>
          </g>
          <path d="M 84 131 C 168 147, 324 147, 418 131 L 410 156 C 326 168, 166 168, 92 156 Z" fill="#1C1E20"/>
        </g>
