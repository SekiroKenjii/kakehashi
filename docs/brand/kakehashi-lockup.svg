  <!-- paper -->
  <rect width="1200" height="630" fill="#F4EADB"/>

  <!-- the icon's world, widened: clouds high, the sun rising behind the ink ground -->
  <g fill="#ECDECA">
    <g><circle cx="150" cy="120" r="22"/><circle cx="183" cy="103" r="30"/><circle cx="218" cy="118" r="21"/><rect x="124" y="112" width="120" height="27" rx="13"/></g>
    <g><circle cx="1010" cy="96" r="19"/><circle cx="1045" cy="81" r="27"/><circle cx="1082" cy="90" r="24"/><rect x="989" y="88" width="118" height="25" rx="12"/></g>
    <g><circle cx="1088" cy="330" r="11"/><circle cx="1103" cy="323" r="14"/><circle cx="1119" cy="330" r="10"/><rect x="1075" y="326" width="56" height="14" rx="7"/></g>
  </g>
  <path d="M 140 660 A 470 150 0 0 1 1060 660 Z" fill="#E7D1B9"/>
  <path d="M 160 655 A 450 88 0 0 1 1050 655 Z" fill="#17181B"/>

  <!-- badge -->
  <g>
    <rect x="496" y="88" width="208" height="40" rx="20" fill="#EFE2CE" stroke="#D9C6AA"/>
    <circle cx="522" cy="108" r="5" fill="#3E9E63"/>
    <text x="541" y="114" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-weight="600" font-size="15" letter-spacing="4.5" fill="#5B5346">SEKIROKENJII</text>
  </g>

  <!-- tile + name -->
  <use href="#tile" transform="translate(140,196) scale(0.36)"/>
  <text x="356" y="316" font-weight="700" font-size="86" fill="#1F2125"><tspan font-family="'Yu Gothic UI','Noto Sans JP','Hiragino Sans','Meiryo',sans-serif" letter-spacing="3">架け橋</tspan><tspan font-family="'Segoe UI Variable Display','Segoe UI',system-ui,Arial,sans-serif" letter-spacing="-2">&#160;Kakehashi</tspan></text>

  <!-- claim -->
  <text x="600" y="430" text-anchor="middle" font-family="'Segoe UI Variable Text','Segoe UI',system-ui,Arial,sans-serif" font-size="24" fill="#8B7B66">The High-Performance bridge you build across</text>
</svg>
