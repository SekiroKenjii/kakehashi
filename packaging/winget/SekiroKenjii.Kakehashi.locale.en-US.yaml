ShortDescription: Scaffold a WinUI 3 client and a Go server in one repository.
Description: >-
  Kakehashi scaffolds a Windows desktop application and the server behind it as one repository: a
  WinUI 3 client, a Go backend, and one Protocol Buffers contract the build checks against both
  halves. Three architecture gates — a module-boundary linter for the server, layering tests for the
  client, and a breaking-change check on the contract — run on every push. The CLI creates a project,
  generates modules and pages across both halves with the wiring, and removes them again.
