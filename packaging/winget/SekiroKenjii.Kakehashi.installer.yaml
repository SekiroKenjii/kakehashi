# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
#
# A portable install: the CLI is one binary with no installer, so winget unpacks the archive and
# puts the binary on PATH. Nothing runs, and uninstalling is a delete.
PackageIdentifier: SekiroKenjii.Kakehashi
PackageVersion: __VERSION__
InstallerType: zip
NestedInstallerType: portable
Commands:
  - kakehashi
ReleaseDate: __RELEASE_DATE__
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/SekiroKenjii/kakehashi/releases/download/tools/cli/v__VERSION__/kakehashi___VERSION___Windows_amd64.zip
    InstallerSha256: __SHA256_WINDOWS_AMD64__
    NestedInstallerFiles:
      - RelativeFilePath: kakehashi.exe
        PortableCommandAlias: kakehashi
  - Architecture: arm64
    InstallerUrl: https://github.com/SekiroKenjii/kakehashi/releases/download/tools/cli/v__VERSION__/kakehashi___VERSION___Windows_arm64.zip
    InstallerSha256: __SHA256_WINDOWS_ARM64__
    NestedInstallerFiles:
      - RelativeFilePath: kakehashi.exe
        PortableCommandAlias: kakehashi
ManifestType: installer
ManifestVersion: 1.6.0
