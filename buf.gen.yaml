# Code generation for the Go side. The .NET side does not appear here: Grpc.Tools generates the
# client at build time straight from proto/, so the client never holds a copy of the schema.
#
# The plugins are local rather than remote on purpose. Remote plugins would remove two `go install`
# lines from the setup, at the cost of uploading the schema to a third party on every generate, and
# of a build that stops working when someone is offline.
#
# Output is committed to the repository. That keeps `go build ./...` working on a fresh clone with
# no buf installed, and CI re-runs `buf generate` and fails on any diff, so committed and generated
# cannot drift apart.

version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: __GO_MODULE__/server/internal/gen

plugins:
  - local: protoc-gen-go
    out: server/internal/gen
    opt: paths=source_relative

  - local: protoc-gen-connect-go
    out: server/internal/gen
    opt: paths=source_relative
