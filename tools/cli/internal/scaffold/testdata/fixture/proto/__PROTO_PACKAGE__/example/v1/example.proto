syntax = "proto3";

package __PROTO_PACKAGE__.example.v1;

option go_package = "__GO_MODULE__/server/internal/gen/__PROTO_PACKAGE__/example/v1;examplev1";
option csharp_namespace = "__ROOT_NAMESPACE__.Contracts.Example.V1";

service ExampleService {
  rpc Ping(PingRequest) returns (PingResponse);
