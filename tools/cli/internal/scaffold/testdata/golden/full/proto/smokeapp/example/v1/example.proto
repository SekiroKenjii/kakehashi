syntax = "proto3";

package smokeapp.example.v1;

option go_package = "example.com/smokeapp/server/internal/gen/smokeapp/example/v1;examplev1";
option csharp_namespace = "SmokeApp.Contracts.Example.V1";

service ExampleService {
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
