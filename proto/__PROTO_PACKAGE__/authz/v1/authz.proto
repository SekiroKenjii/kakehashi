syntax = "proto3";

// Authorization: who may do what, and to which rows.
//
// Textbook RBAC — accounts hold roles, roles hold permissions — with one thing that is not
// textbook: every grant carries a scope. A permission and the rows it reaches are one decision, so
// they travel together here rather than as two messages a client has to correlate.
package __PROTO_PACKAGE__.authz.v1;

option csharp_namespace = "__ROOT_NAMESPACE__.Authz.V1";

import "google/protobuf/timestamp.proto";

// Scope is how much of a table a grant reaches. This is the row-level half.
enum Scope {
  SCOPE_UNSPECIFIED = 0;

  // Rows the caller owns.
  SCOPE_OWN = 1;

  // Rows owned by anyone sharing the caller's team.
  SCOPE_TEAM = 2;

  // Every row.
  SCOPE_ALL = 3;
}

// Permission is one thing a role may be granted. The catalogue is assembled from what the modules
// declare, so nothing here is editable — a client renders it and picks from it.
message Permission {
  // "<module>.<verb>": users.manage, notes.read. Renaming one revokes it everywhere at once, which
  // is why it is the stable identifier rather than the display name.
  string key = 1;

  string name = 2;
  string description = 3;

  // Groups the permission on the administration screen — "Administration", "DevOps".
  string category = 4;

  // Worth a second look. Presentation, not policy: nothing behaves differently, a human reads more
  // carefully.
  bool is_high_risk = 5;

  // Whether the scope on a grant of this permission is honoured by the code that enforces it.
  //
  // Row scope only means something where a store narrows its own query on it. Declaring it here
  // rather than assuming it everywhere is what lets an administration screen offer the choice
  // exactly where it changes an answer — a scope picker on a permission nobody narrows on reads as
  // a row-level control and is decoration.
  bool is_scoped = 6;
}

// Role is a named set of grants.
message Role {
  string id = 1;
  string name = 2;
  string description = 3;

  // Ships with the product. Such a role may be re-granted freely and never deleted: a deployment
  // that deleted its administrator role has no way back in.
  bool is_system = 4;

  // How many permissions it grants, and how many accounts hold it. Both are on the list screen and
  // neither is derivable from anything else in this message, so they are sent rather than counted.
  int32 permission_count = 5;
  int32 account_count = 6;
}

// Grant is one permission on one role, and how far it reaches.
message Grant {
  string permission_key = 1;
  Scope scope = 2;
}

// AuditEntry is one recorded change to who may do what.
//
// It records the CHANGE rather than the resulting state — "granted devops.sql at scope all" answers
// the question an access review actually asks, which a snapshot of the end state cannot.
message AuditEntry {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;

  // The account that made the change, and the name it had at the time. The name is denormalised on
  // purpose: an audit trail that shows a blank where a deleted administrator used to be is an audit
  // trail with a hole exactly where somebody is looking.
  string actor_id = 3;
  string actor_name = 4;

  // "Granted", "Revoked", "Rescoped", "RoleCreated"… A string rather than an enum, for the reason
  // the account module's event kinds are: an unrecognised one is printable and greppable, and a
  // deployment that adds an action should not have to widen a type in this file.
  string action = 5;

  // Empty for the actions that do not concern one — a role assignment names no permission.
  string role_id = 6;
  string role_name = 7;
  string permission_key = 8;

  // What the other fields cannot carry: the scope a grant moved to, the name of something that no
  // longer exists to be looked up.
  string detail = 9;
}

// AuthzService is what every signed-in caller may ask about themselves.
//
// Read-only, and about the caller only. Reading somebody else's access is administrative and lives
// on the other service.
service AuthzService {
  // ListMyGrants returns every permission the caller holds and the scope each reaches.
  //
  // Which account that is comes from the bearer token, so there is no id in the request and no way
  // to ask about somebody else's. A call with no verified caller is UNAUTHENTICATED rather than an
  // empty list: an account that may do nothing and an expired token draw the same screen and mean
  // opposite things.
  //
  // The client uses it to draw locks, not to enforce them. Every route is checked server-side
  // against the same table, so a client that never called this is refused identically.
  rpc ListMyGrants(ListMyGrantsRequest) returns (ListMyGrantsResponse);
}

// AuthzAdminService is the administrator's surface.
//
// A second service rather than more procedures on the one above, and that is the load-bearing
// decision in this file: the server protects whole routes, so a service mounted behind one
// permission check protects every procedure added to it later without anyone remembering to. Mixed
// into the read service, each of these would need a hand-written check that nothing verifies.
//
// Everything here requires roles.manage.
service AuthzAdminService {
  // ListRoles returns every role with its counts.
  rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);

  // ListPermissions returns the whole catalogue, for the grid the screen renders.
  //
  // Unpaged: the count is bounded by how many permissions are compiled into a build, which is a
  // number a person maintains by hand.
  rpc ListPermissions(ListPermissionsRequest) returns (ListPermissionsResponse);

  // GetRoleGrants returns one role's grants.
  rpc GetRoleGrants(GetRoleGrantsRequest) returns (GetRoleGrantsResponse);

  // SaveRoleGrants replaces a role's entire grant set, in one act.
  //
  // The whole set rather than a diff, because that is what the screen has: an administrator flips
  // eight toggles and presses Save once, and sending eight calls would give them no way to change
  // their mind and would write eight audit entries for one decision. The server applies it in a
  // transaction, so a half-saved role is not a state anybody can observe.
  rpc SaveRoleGrants(SaveRoleGrantsRequest) returns (SaveRoleGrantsResponse);

  // CreateRole adds a role, optionally copying another's grants — which is what "Clone role" is.
  rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);

  // UpdateRole renames a role or rewrites its description.
  //
  // A system role keeps its name: boot reconciles the shipped roles BY name, so renaming Admin
  // would have the next boot recreate "Admin" beside it. Its description may change.
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);

  // DeleteRole removes a role and everything referring to it. Refused for a system role.
  rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);

  // AssignRole gives an account a role, naming the account by email.
  //
  // Keyed by email because that is what an administrator has. The server resolves it and stores the
  // account's id, so a later change of address does not silently revoke anything. An address with
  // no account is NOT_FOUND rather than a grant waiting for one to appear.
  rpc AssignRole(AssignRoleRequest) returns (AssignRoleResponse);

  // UnassignRole takes a role away.
  //
  // Effective on the next request rather than the next sign-in, because grants are resolved per
  // request and deliberately are not a claim in the token.
  rpc UnassignRole(UnassignRoleRequest) returns (UnassignRoleResponse);

  // ListAccountRoles returns who holds which roles, for every account at once.
  //
  // Here rather than on the account service, and that is the module boundary showing through: the
  // account module owns people, this one owns what they may do, and an account message carrying
  // roles would be two modules holding the same fact. The users screen calls both and joins by id
  // — one extra round trip, in exchange for the two never disagreeing.
  rpc ListAccountRoles(ListAccountRolesRequest) returns (ListAccountRolesResponse);

  // ListAuditEntries returns the most recent changes, newest first. Requires audit.view.
  rpc ListAuditEntries(ListAuditEntriesRequest) returns (ListAuditEntriesResponse);
}

message ListMyGrantsRequest {}

message ListMyGrantsResponse {
  repeated Grant grants = 1;
}

message ListRolesRequest {}

message ListRolesResponse {
  repeated Role roles = 1;

  // How many permissions exist in total, so the screen can render "22 / 34" without a second call.
  int32 permission_total = 2;
}

message ListPermissionsRequest {}

message ListPermissionsResponse {
  // Ordered by category then name, which is the order the screen draws them in. Sorting server-side
  // means every client agrees, and a client that renders them in receipt order is correct.
  repeated Permission permissions = 1;
}

message GetRoleGrantsRequest {
  string role_id = 1;
}

message GetRoleGrantsResponse {
  repeated Grant grants = 1;
}

message SaveRoleGrantsRequest {
  string role_id = 1;

  // The complete set. A permission absent from this list is revoked — which is what makes it one
  // act rather than a series of them.
  repeated Grant grants = 2;
}

message SaveRoleGrantsResponse {
  // What actually changed, so the client can show it and the audit trail and the screen agree.
  int32 granted = 1;
  int32 revoked = 2;
  int32 rescoped = 3;
}

message CreateRoleRequest {
  string name = 1;
  string description = 2;

  // Copy this role's grants into the new one. Empty means an empty role.
  string clone_from_role_id = 3;
}

message CreateRoleResponse {
  Role role = 1;
}

message UpdateRoleRequest {
  string role_id = 1;
  string name = 2;
  string description = 3;
}

message UpdateRoleResponse {
  Role role = 1;
}

message DeleteRoleRequest {
  string role_id = 1;
}

message DeleteRoleResponse {}

message AssignRoleRequest {
  string email = 1;
  string role_id = 2;
}

message AssignRoleResponse {}

message UnassignRoleRequest {
  string email = 1;
  string role_id = 2;
}

message UnassignRoleResponse {}

message ListAccountRolesRequest {
  // Restrict the answer to these accounts. Empty asks about everybody, which is what the users
  // screen does — it is already listing all of them.
  repeated string account_ids = 1;
}

// AccountRoles is one account's roles.
//
// A repeated message rather than a map<string, ...>, because protobuf maps cannot hold a repeated
// value and the alternative — a map to a wrapper message — is the same shape with an extra name.
message AccountRoles {
  string account_id = 1;
  repeated Role roles = 2;
}

message ListAccountRolesResponse {
  // Accounts holding no role are absent rather than present and empty. A client reading this into
  // a lookup gets the same answer either way, and the wire carries less of what it already knew.
  repeated AccountRoles accounts = 1;
}

message ListAuditEntriesRequest {
  // How many of the newest entries to return. Less than one means the server's default, and
  // anything unreasonably large is clamped rather than rejected.
  int32 page_size = 1;
}

message ListAuditEntriesResponse {
  repeated AuditEntry entries = 1;
}
