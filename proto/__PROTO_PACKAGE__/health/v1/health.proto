syntax = "proto3";

// Liveness and round-trip verification.
//
// This is the smallest possible contract, and it exists to prove the whole chain works before any
// real feature depends on it: the schema generates, the server mounts it, the client's generated
// stub reaches it, and the answer comes back with the shape both sides expected. When the client's
// home page reports "Connected", this is what it called.
package __PROTO_PACKAGE__.health.v1;

option csharp_namespace = "__ROOT_NAMESPACE__.Health.V1";

import "google/protobuf/timestamp.proto";

// HealthService answers whether the server is up and able to respond.
//
// It deliberately touches no database. A health check that fails when the database is slow tells
// you the database is slow, not whether the process is alive, and conflating the two makes both
// signals useless. Storage readiness belongs in its own check.
service HealthService {
  // Ping echoes the caller's message back with the server's clock.
  //
  // The echo is not decoration. It proves the request body was actually parsed rather than a
  // status code being returned by something in front of the server, which is exactly the failure a
  // reverse proxy in the wrong mode produces.
  rpc Ping(PingRequest) returns (PingResponse);

  // System is the storage-readiness check Ping deliberately is not: it reports the process's
  // version, when it started, and whether each dependency answers.
  //
  // The route is public, like Ping, so the response is bounded to what a stranger may know:
  // dependency names come from the server's own wiring and an unreachable dependency reports
  // ok = false and nothing else — never an error string, which is where connection strings and
  // internal hostnames leak from.
  rpc System(SystemRequest) returns (SystemResponse);
}

// PingRequest carries an arbitrary string for the server to echo.
message PingRequest {
  // Any value. The server returns it unchanged; an empty string is valid.
  string message = 1;
}

// SystemRequest carries nothing. It exists because every method needs a request type, and reusing
// another method's request couples two calls that evolve separately.
message SystemRequest {}

// SystemResponse describes the running process and the dependencies it answers with.
message SystemResponse {
  // What the binary was built as. "dev" when nothing was injected at build time.
  string version = 1;

  // When the process started. Clients render the difference from server_time as uptime rather
  // than trusting their own clock for it.
  google.protobuf.Timestamp started_at = 2;

  // The server's clock when it answered, for the same reason Ping carries it.
  google.protobuf.Timestamp server_time = 3;

  // One entry per dependency the process needs, in the server's own order.
  repeated Dependency dependencies = 4;
}

// Dependency is one thing the server needs and whether it answered just now.
message Dependency {
  // A display name chosen by the server's wiring, for example "SQL Server". Not an address.
  string name = 1;

  // Whether the dependency answered within the server's own deadline.
  bool ok = 2;

  // How long the answer took, in milliseconds. Meaningless when ok is false.
  int64 latency_ms = 3;
}

// PingResponse carries the echoed message and the server's view of the current time.
message PingResponse {
  // The message from the request, unchanged.
  string message = 1;

  // The server's clock when it answered.
  //
  // No "utc" suffix: google.protobuf.Timestamp is defined as UTC since the Unix epoch, so the
  // suffix would restate the type. Clients compare it against their own clock to surface the skew
  // that otherwise shows up much later as tokens that expire early or refuse to validate.
  google.protobuf.Timestamp server_time = 2;
}
